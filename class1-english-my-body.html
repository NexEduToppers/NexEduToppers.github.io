<body>

<header>
    <h1>RawaRajpootNexEduToppers</h1>
    <p>Learning Academy</p>
    <p>Class 1 English · My Body and Its Parts</p>
</header>

<div class="container">

    <a class="back-link" href="class1-english-chapter1.html">
        ← Back to Chapter 1
    </a>

    <div class="quiz-card">

        <div id="quizArea">
            <h2>Let's Practise!</h2>

            <div class="progress">
                <span id="questionCount">Question 1 of 13</span>
                <span id="scoreCount">Score: 0</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div id="sectionName"></div>
            <p id="question"></p>

            <div class="options" id="options"></div>

            <div id="feedback" role="status" aria-live="polite"></div>

            <button id="nextBtn" type="button" onclick="nextQuestion()">
                Next Question →
            </button>
        </div>

        <div id="result">
            <h2>Quiz Completed!</h2>
            <p id="finalMessage"></p>
            <div id="finalScore"></div>
            <p id="finalDetails"></p>

            <button id="restartBtn" type="button" onclick="restartQuiz()">
                Play Again ↻
            </button>
        </div>

    </div>

    <footer>
        Keep learning, keep practising!
    </footer>

</div>

<script>
const questions = [
    {
        section: "A. Fill in the blanks",
        question: "We see with our ____.",
        options: ["Eyes", "Ears", "Legs"],
        answer: "Eyes"
    },
    {
        section: "A. Fill in the blanks",
        question: "We hear with our ____.",
        options: ["Hands", "Ears", "Nose"],
        answer: "Ears"
    },
    {
        section: "A. Fill in the blanks",
        question: "We smell with our ____.",
        options: ["Nose", "Teeth", "Eyes"],
        answer: "Nose"
    },
    {
        section: "A. Fill in the blanks",
        question: "We walk with our ____.",
        options: ["Tongue", "Legs", "Ears"],
        answer: "Legs"
    },
    {
        section: "A. Fill in the blanks",
        question: "We taste food with our ____.",
        options: ["Tongue", "Hands", "Nose"],
        answer: "Tongue"
    },
    {
        section: "B. Match the body part to its use",
        question: "Eyes help us with ____.",
        options: ["Seeing", "Hearing", "Walking"],
        answer: "Seeing"
    },
    {
        section: "B. Match the body part to its use",
        question: "Ears help us with ____.",
        options: ["Tasting", "Hearing", "Smelling"],
        answer: "Hearing"
    },
    {
        section: "B. Match the body part to its use",
        question: "The nose helps us with ____.",
        options: ["Walking", "Seeing", "Smelling"],
        answer: "Smelling"
    },
    {
        section: "B. Match the body part to its use",
        question: "Legs help us with ____.",
        options: ["Walking", "Tasting", "Hearing"],
        answer: "Walking"
    },
    {
        section: "B. Match the body part to its use",
        question: "The tongue helps us with ____.",
        options: ["Smelling", "Tasting", "Seeing"],
        answer: "Tasting"
    },
    {
        section: "C. Choose the correct answer",
        question: "Which body part helps us hold a pencil?",
        options: ["Feet", "Hands", "Ears"],
        answer: "Hands"
    },
    {
        section: "C. Choose the correct answer",
        question: "Which body part helps us chew food?",
        options: ["Teeth", "Nose", "Eyes"],
        answer: "Teeth"
    },
    {
        section: "C. Choose the correct answer",
        question: "Which body part helps us hear music?",
        options: ["Tongue", "Legs", "Ears"],
        answer: "Ears"
    }
];

const praiseMessages = [
    "Good Job! 🌟",
    "Great! Keep it up! 👏",
    "Excellent! 🎉",
    "Brilliant! ⭐",
    "Well Done! 😊",
    "Fantastic! 🌈"
];

const tryMessages = [
    "Not quite! Keep trying. 💪",
    "Good try! Let's learn together. 😊",
    "Keep practising—you can do it! 🌟"
];

let currentIndex = 0;
let score = 0;
let answered = false;

function showQuestion() {
    answered = false;

    const item = questions[currentIndex];

    document.getElementById("questionCount").textContent =
        `Question ${currentIndex + 1} of ${questions.length}`;

    document.getElementById("scoreCount").textContent =
        `Score: ${score}`;

    document.getElementById("progressFill").style.width =
        `${(currentIndex / questions.length) * 100}%`;

    document.getElementById("sectionName").textContent = item.section;
    document.getElementById("question").textContent = item.question;

    const optionsBox = document.getElementById("options");
    optionsBox.innerHTML = "";

    document.getElementById("feedback").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";

    item.options.forEach(optionText => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "option";
        button.textContent = optionText;

        button.addEventListener("click", () => {
            checkAnswer(button, optionText);
        });

        optionsBox.appendChild(button);
    });
}

function checkAnswer(selectedButton, selectedAnswer) {
    if (answered) return;

    answered = true;

    const item = questions[currentIndex];
    const buttons = document.querySelectorAll(".option");
    const feedback = document.getElementById("feedback");

    buttons.forEach(button => {
        button.disabled = true;

        if (button.textContent === item.answer) {
            button.classList.add("correct");
        }
    });

    if (selectedAnswer === item.answer) {
        score++;

        feedback.textContent =
            praiseMessages[Math.floor(Math.random() * praiseMessages.length)];

        feedback.style.background = "#d8f5df";
        feedback.style.color = "#14552a";
    } else {
        selectedButton.classList.add("wrong");

        feedback.textContent =
            tryMessages[Math.floor(Math.random() * tryMessages.length)] +
            " Correct answer: " + item.answer + ".";

        feedback.style.background = "#ffe0e0";
        feedback.style.color = "#8b1717";
    }

    feedback.style.display = "block";

    document.getElementById("scoreCount").textContent =
        `Score: ${score}`;

    document.getElementById("nextBtn").textContent =
        currentIndex === questions.length - 1
            ? "See My Result"
            : "Next Question →";

    document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
    if (!answered) return;

    currentIndex++;

    if (currentIndex < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quizArea").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("progressFill").style.width = "100%";

    document.getElementById("finalScore").textContent =
        `${score} / ${questions.length}`;

    document.getElementById("finalDetails").textContent =
        `You answered ${score} out of ${questions.length} questions correctly.`;

    let message;

    if (score === questions.length) {
        message = "Perfect score! Excellent work! 🏆";
    } else if (score >= 10) {
        message = "Very good work! Keep practising! 🌟";
    } else if (score >= 6) {
        message = "Good effort! Practise a little more! 😊";
    } else {
        message = "Keep learning! Try the quiz again. 💪";
    }

    document.getElementById("finalMessage").textContent = message;
    document.getElementById("restartBtn").style.display = "block";
}

function restartQuiz() {
    currentIndex = 0;
    score = 0;
    answered = false;

    document.getElementById("quizArea").style.display = "block";
    document.getElementById("result").style.display = "none";
    document.getElementById("restartBtn").style.display = "none";

    showQuestion();
}

showQuestion();
</script>

</body>
</html>
