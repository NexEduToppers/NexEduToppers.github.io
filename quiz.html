<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kids Learning Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f7ff;
            padding: 20px;
        }

        .quiz-box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            color: #333;
        }

        #progress {
            font-size: 17px;
            color: #666;
            margin: 10px;
        }

        #question {
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
        }

        #quizImage {
            display: none;
            width: 350px;
            height: 250px;
            object-fit: contain;
            margin: 20px auto;
        }

        .option {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 15px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #e6e6e6;
        }

        .option:hover {
            background: #d5d5d5;
        }

        .option.correct {
            background: #28a745;
            color: white;
        }

        .option.wrong {
            background: #dc3545;
            color: white;
        }

        #message {
            font-size: 21px;
            font-weight: bold;
            margin: 15px;
        }

        #nextBtn {
            padding: 12px 30px;
            background: #4CAF50;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            margin-top: 15px;
        }

        #nextBtn:hover {
            background: #388e3c;
        }
    </style>
</head>

<body>

    <div class="quiz-box">

        <h1>🌟 Kids Learning Quiz 🌟</h1>

        <div id="progress"></div>

        <div id="question"></div>

        <img id="quizImage" src="" alt="Question Image">

        <div id="options"></div>

        <div id="message"></div>

        <button id="nextBtn" onclick="nextQuestion()">
            Next ➡️
        </button>

    </div>


    <script>

        const questions = [

            {
                question: "What is this?",
                image: "images/flower.png",
                options: ["Flower", "Ball", "Cat", "Dog"],
                answer: "Flower"
            },

            {
                question: "Which animal says Meow?",
                image: "",
                options: ["Dog", "Cat", "Cow", "Lion"],
                answer: "Cat"
            },

            {
                question: "How many fingers are on one hand?",
                image: "",
                options: ["3", "4", "5", "6"],
                answer: "5"
            },

            {
                question: "Which animal is shown in this picture?",
                image: "images/dog.png",
                options: ["Cat", "Dog", "Fish", "Bird"],
                answer: "Dog"
            },

            {
                question: "How many legs does a spider have?",
                image: "",
                options: ["4", "6", "8", "10"],
                answer: "8"
            },

            {
                question: "Which fruit is yellow and curved?",
                image: "",
                options: ["Apple", "Banana", "Orange", "Grapes"],
                answer: "Banana"
            },

            {
                question: "What do bees make?",
                image: "",
                options: ["Milk", "Honey", "Juice", "Water"],
                answer: "Honey"
            },

            {
                question: "Which of these is shown in this picture?",
                image: "images/car.png",
                options: ["Car", "House", "Tree", "Book"],
                answer: "Car"
            },

            {
                question: "What do cows give us to drink?",
                image: "",
                options: ["Juice", "Water", "Milk", "Soda"],
                answer: "Milk"
            },

            {
                question: "Which animal is shown in this picture?",
                image: "images/elephant.png",
                options: ["Lion", "Elephant", "Monkey", "Zebra"],
                answer: "Elephant"
            }

        ];


        let currentQuestion = 0;
        let score = 0;
        let answered = false;


        function loadQuestion() {

            answered = false;

            const q = questions[currentQuestion];

            document.getElementById("progress").innerText =
                "Question " +
                (currentQuestion + 1) +
                " of " +
                questions.length;


            document.getElementById("question").innerText =
                q.question;


            const image = document.getElementById("quizImage");


            if (q.image !== "") {

                image.src = q.image;
                image.style.display = "block";

            } else {

                image.src = "";
                image.style.display = "none";

            }


            document.getElementById("message").innerText = "";


            const optionsBox =
                document.getElementById("options");

            optionsBox.innerHTML = "";


            q.options.forEach(function(option) {

                const button =
                    document.createElement("button");

                button.innerText = option;

                button.className = "option";

                button.onclick = function() {

                    checkAnswer(option);

                };

                optionsBox.appendChild(button);

            });

        }


        function checkAnswer(selectedAnswer) {

            if (answered) {
                return;
            }

            answered = true;

            const q = questions[currentQuestion];

            const buttons =
                document.querySelectorAll(".option");


            buttons.forEach(function(button) {

                if (button.innerText === selectedAnswer) {

                    if (selectedAnswer === q.answer) {

                        button.classList.add("correct");

                    } else {

                        button.classList.add("wrong");

                    }

                }

            });


            if (selectedAnswer === q.answer) {

                score++;

                document.getElementById("message").innerText =
                    "✅ Correct Answer!";

            } else {

                document.getElementById("message").innerText =
                    "❌ Wrong Answer! Correct Answer: " +
                    q.answer;

            }

        }


        function nextQuestion() {

            if (!answered) {

                alert("Please select an answer first.");

                return;

            }


            currentQuestion++;


            if (currentQuestion < questions.length) {

                loadQuestion();

            } else {

                document.querySelector(".quiz-box").innerHTML =

                    "<h1>🎉 Quiz Complete! 🎉</h1>" +

                    "<h2>Your Score</h2>" +

                    "<h1>" +
                    score +
                    " / " +
                    questions.length +
                    "</h1>" +

                    "<p>" +
(
    score === questions.length
        ? "🎉 Outstanding! Perfect Score!"
        : score / questions.length >= 0.9
        ? "🏆 Excellent Job!"
        : score / questions.length >= 0.7
        ? "🌟 Great Job!"
        : score / questions.length >= 0.5
        ? "👍 Keep Practising!"
        : score / questions.length >= 0.3
        ? "🙂 Keep Practising!"
        : "😟 Keep Practising!"
) +
"</p>" +


                    "<button id='nextBtn' " +
                    "onclick='location.reload()'>" +

                    "Play Again 🔄" +

                    "</button>";

            }

        }


        loadQuestion();

    </script>

</body>

</html>
